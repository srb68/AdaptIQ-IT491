<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | AdaptIQ</title>
  <style>
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      place-items: center;
      background: #0a0a0a;
      color: #f2f2f2;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(100%, 36rem);
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid #303030;
      border-radius: 12px;
      background: #111;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 24px;
      color: #bcbcbc;
    }

    a {
      color: inherit;
      text-underline-offset: 3px;
    }

    nav a {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #f2f2f2;
      border-radius: 4px;
      background: #f2f2f2;
      color: #0a0a0a;
    }

    a:focus-visible {
      outline: 2px solid #77afff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>No worries you can return to <a href="/app.html">app.html</a></p>
    <nav aria-label="AdaptIQ">
      <a href="/">Return home</a>
    </nav>
  </main>
</body>
</html>
